---
- name: Initial setup and Prerequisites.
  hosts: all
  become: true
  tasks:
      - name: Ping hosts
        ansible.builtin.ping:

      - name: Update and upgrade apt packages
        ansible.builtin.apt:
            update_cache: true
            upgrade: true

      - name: Install mandatory system packages
        ansible.builtin.apt:
            pkg:
                - conntrack
                - socat
                - ipset
            state: present

      - name: Set architecture mapping
        ansible.builtin.set_fact:
            deb_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
            go_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

      - name: Load bridge-netfilter and overlay modules
        ansible.builtin.shell: |
            modprobe overlay
            modprobe br_netfilter
        changed_when: false

      - name: Set sysctl parameters for Kubernetes
        ansible.builtin.copy:
            dest: /etc/sysctl.d/k8s.conf
            content: |
                net.bridge.bridge-nf-call-iptables  = 1
                net.bridge.bridge-nf-call-ip6tables = 1
                net.ipv4.ip_forward                 = 1
            mode: "0644"

      - name: Apply sysctl parameters
        ansible.builtin.command: sysctl --system
        changed_when: false

      - name: Disable swap
        ansible.builtin.command: swapoff -a
        when: ansible_swaptotal_mb > 0
        changed_when: true

      - name: Disable swap in fstab
        ansible.builtin.replace:
            path: /etc/fstab
            regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
            replace: '# \1'

- name: Install Docker.
  gather_facts: false
  hosts: all
  become: true
  tasks:
      - name: Install aptitude
        ansible.builtin.apt:
            name: aptitude
            state: present
            update_cache: true

      - name: Install required system packages
        ansible.builtin.apt:
            pkg:
                - apt-transport-https
                - ca-certificates
                - curl
            state: present
            update_cache: true

      - name: Add Docker GPG apt Key
        ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

      - name: Add Docker Repository
        ansible.builtin.apt_repository:
            repo: deb https://download.docker.com/linux/ubuntu focal stable
            state: present

      - name: Install Docker
        ansible.builtin.apt:
            pkg:
                - docker-ce
                - docker-ce-cli
                - containerd.io
                - docker-buildx-plugin
                - docker-compose-plugin
            state: present
            update_cache: true

      - name: Test docker installation
        ansible.builtin.command:
            cmd: docker --version
        register: docker_version
        changed_when: docker_version.rc != 0

- name: Install cri-dockerd.
  hosts: all
  become: true
  vars:
      cri_dockerd_version: "0.3.21"
  tasks:
      - name: Download cri-dockerd binary
        ansible.builtin.get_url:
            url: "https://github.com/Mirantis/cri-dockerd/releases/download/v{{ cri_dockerd_version }}/cri-dockerd-{{ cri_dockerd_version }}.{{ go_arch }}.tgz"
            dest: "/tmp/cri-dockerd-{{ cri_dockerd_version }}.{{ go_arch }}.tgz"
            mode: "0644"

      - name: Extract cri-dockerd archive
        ansible.builtin.unarchive:
            src: "/tmp/cri-dockerd-{{ cri_dockerd_version }}.{{ go_arch }}.tgz"
            dest: /tmp
            remote_src: true

      - name: Copy cri-dockerd binary to /usr/local/bin
        ansible.builtin.copy:
            src: /tmp/cri-dockerd/cri-dockerd
            dest: /usr/local/bin/cri-dockerd
            mode: "0755"
            remote_src: true

      - name: Download cri-dockerd systemd service file
        ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/Mirantis/cri-dockerd/master/packaging/systemd/cri-docker.service
            dest: /etc/systemd/system/cri-docker.service
            mode: "0644"

      - name: Download cri-dockerd systemd socket file
        ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/Mirantis/cri-dockerd/master/packaging/systemd/cri-docker.socket
            dest: /etc/systemd/system/cri-docker.socket
            mode: "0644"

      - name: Update ExecStart path in cri-docker.service
        ansible.builtin.replace:
            path: /etc/systemd/system/cri-docker.service
            regexp: "/usr/bin/cri-dockerd"
            replace: "/usr/local/bin/cri-dockerd"

      - name: Enable and start cri-docker socket
        ansible.builtin.systemd:
            name: cri-docker.socket
            enabled: true
            state: started
            daemon_reload: true

      - name: Enable and start cri-docker service
        ansible.builtin.systemd:
            name: cri-docker.service
            enabled: true
            state: started

      - name: Configure crictl to use cri-dockerd socket
        ansible.builtin.copy:
            dest: /etc/crictl.yaml
            content: |
                runtime-endpoint: unix:///var/run/cri-dockerd.sock
                image-endpoint: unix:///var/run/cri-dockerd.sock
                timeout: 10
                debug: false
            mode: "0644"

- name: Install Kubernetes Components
  hosts: all
  become: true
  tasks:
      - name: Install required system packages for Kubernetes
        ansible.builtin.apt:
            pkg:
                - apt-transport-https
                - ca-certificates
                - curl
                - gpg
                - conntrack
            state: present
            update_cache: true

      - name: Create directory for Kubernetes apt key
        ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

      - name: Check if Kubernetes apt key exists
        ansible.builtin.stat:
            path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        register: k8s_keyring

      - name: Download Kubernetes apt key
        ansible.builtin.shell: |
            curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        when: not k8s_keyring.stat.exists

      - name: Add Kubernetes apt repository
        ansible.builtin.shell: |
            echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
        changed_when: false

      - name: Install kubelet, kubeadm and kubectl
        ansible.builtin.apt:
            pkg:
                - kubelet
                - kubeadm
                - kubectl
            state: present
            update_cache: true

      - name: Hold Kubernetes packages
        ansible.builtin.shell: |
            apt-mark hold kubelet kubeadm kubectl
        changed_when: false

      - name: Ensure kubelet is enabled and started
        ansible.builtin.systemd:
            name: kubelet
            enabled: true
            state: started

- name: Initialize Kubernetes Cluster on Master
  hosts: master
  become: true
  tasks:
      - name: Restart cri-docker service to ensure it is healthy
        ansible.builtin.systemd:
            name: cri-docker.service
            state: restarted

      - name: Wait for cri-dockerd socket
        ansible.builtin.wait_for:
            path: /var/run/cri-dockerd.sock
            state: present
            timeout: 30

      - name: Initialize the cluster
        ansible.builtin.command:
            cmd: kubeadm init --cri-socket=unix:///var/run/cri-dockerd.sock --pod-network-cidr=10.244.0.0/16 --ignore-preflight-errors=all
        register: kubeadm_init
        changed_when: "'Your Kubernetes control-plane has initialized successfully!' in kubeadm_init.stdout"
        failed_when: kubeadm_init.rc != 0 and 'already exists' not in kubeadm_init.stderr

      - name: Create .kube directory
        ansible.builtin.file:
            path: "/home/{{ ansible_user }}/.kube"
            state: directory
            mode: "0755"
            owner: "{{ ansible_user }}"

      - name: Copy admin.conf to user's kube config
        ansible.builtin.copy:
            src: /etc/kubernetes/admin.conf
            dest: "/home/{{ ansible_user }}/.kube/config"
            remote_src: true
            owner: "{{ ansible_user }}"
            mode: "0600"

      - name: Install Flannel CNI
        ansible.builtin.command:
            cmd: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
        become: false
        changed_when: false

      - name: Get join command
        ansible.builtin.command: kubeadm token create --print-join-command
        register: join_command
        changed_when: false

- name: Join Worker Nodes to Cluster
  hosts: workers
  become: true
  tasks:
      - name: Join cluster
        ansible.builtin.command:
            cmd: "{{ hostvars[groups['master'][0]]['join_command']['stdout'] }} --cri-socket=unix:///var/run/cri-dockerd.sock"
        register: kubeadm_join
        changed_when: "'This node has joined the cluster' in kubeadm_join.stdout"
        failed_when: kubeadm_join.rc != 0 and 'already exists' not in kubeadm_join.stderr

- name: Install and Configure CockroachDB Cluster
  hosts: cockroachdb
  become: true
  vars:
      crdb_version: "v25.1.0"
      crdb_binary_url: "https://binaries.cockroachdb.com/cockroach-{{ crdb_version }}.linux-{{ go_arch }}.tgz"
      crdb_install_dir: "/usr/local/bin"
      crdb_data_dir: "/var/lib/cockroach"
      crdb_run_dir: "/var/run/cockroach"
      crdb_download_dest: "/tmp/cockroach-{{ crdb_version }}.linux-{{ go_arch }}.tgz"
      crdb_extract_dest: "/tmp"
      crdb_extracted_path: "/tmp/cockroach-{{ crdb_version }}.linux-{{ go_arch }}/cockroach"
      crdb_user: cockroach
      crdb_group: cockroach

  tasks:
      - name: Ensure cockroach group exists
        ansible.builtin.group:
            name: "{{ crdb_group }}"
            state: present
            system: true

      - name: Ensure cockroach user exists
        ansible.builtin.user:
            name: "{{ crdb_user }}"
            group: "{{ crdb_group }}"
            home: "{{ crdb_data_dir }}"
            shell: /sbin/nologin
            system: true
            create_home: false
            state: present

      - name: Install chrony NTP client
        ansible.builtin.package:
            name: chrony
            state: present
        register: chrony_install_result

      - name: Configure chrony to use Google NTP servers
        ansible.builtin.blockinfile:
            path: /etc/chrony/chrony.conf
            block: |
                # Google Public NTP Servers
                server time1.google.com iburst prefer
                server time2.google.com iburst
                server time3.google.com iburst
                server time4.google.com iburst
            marker: "# {mark} ANSIBLE MANAGED BLOCK - Google NTP"
            state: present
        notify: Restart chrony
        when: chrony_install_result is success

      - name: Ensure chrony service is running and enabled
        ansible.builtin.service:
            name: chrony
            state: started
            enabled: true
        when: chrony_install_result is success

      - name: Ensure target directories exist
        ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ crdb_user }}"
            group: "{{ crdb_group }}"
            mode: "0700"
        loop:
            - "{{ crdb_data_dir }}"

      - name: Check if CockroachDB binary already exists
        ansible.builtin.stat:
            path: "{{ crdb_install_dir }}/cockroach"
        register: cockroach_binary_stat

      - name: Ensure runtime directory exists
        ansible.builtin.file:
            path: "{{ crdb_run_dir }}"
            state: directory
            owner: "{{ crdb_user }}"
            group: "{{ crdb_group }}"
            mode: "0755"

      - name: Download CockroachDB binary archive
        ansible.builtin.get_url:
            url: "{{ crdb_binary_url }}"
            dest: "{{ crdb_download_dest }}"
            mode: "0644"
        when: not cockroach_binary_stat.stat.exists

      - name: Extract CockroachDB archive
        ansible.builtin.unarchive:
            src: "{{ crdb_download_dest }}"
            dest: "{{ crdb_extract_dest }}"
            remote_src: true
            creates: "{{ crdb_extracted_path }}"

        when:
            - not ansible_check_mode
            - not cockroach_binary_stat.stat.exists

      - name: Stat extracted binary path
        ansible.builtin.stat:
            path: "{{ crdb_extracted_path }}"
        register: crdb_extracted_stat
        when: not cockroach_binary_stat.stat.exists

      - name: Copy CockroachDB binary to install directory
        ansible.builtin.copy:
            src: "{{ crdb_extracted_path }}"
            dest: "{{ crdb_install_dir }}/cockroach"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
        when:
            - not cockroach_binary_stat.stat.exists
            - crdb_extracted_stat.stat is defined and crdb_extracted_stat.stat.exists
        notify:
            - Reload systemd

      - name: Clean up downloaded archive and extracted files
        ansible.builtin.file:
            path: "{{ item }}"
            state: absent
        loop:
            - "{{ crdb_download_dest }}"
            - "/tmp/cockroach-{{ crdb_version }}.linux-{{ go_arch }}"
        when: not ansible_check_mode

      - name: Template CockroachDB systemd service file
        ansible.builtin.template:
            src: templates/cockroachdb.service.j2
            dest: /etc/systemd/system/cockroachdb.service
            owner: root
            group: root
            mode: "0644"
        notify:
            - Reload systemd
            - Restart cockroachdb

      - name: Ensure CockroachDB service is enabled and started
        ansible.builtin.systemd:
            name: cockroachdb
            enabled: true
            state: started
            daemon_reload: true

  handlers:
      - name: Reload systemd
        ansible.builtin.systemd:
            daemon_reload: true

      - name: Restart cockroachdb
        ansible.builtin.systemd:
            name: cockroachdb
            state: restarted

      - name: Restart chrony
        ansible.builtin.service:
            name: chrony
            state: restarted
            enabled: true

- name: Initialize the CockroachDB Cluster
  hosts: cockroachdb[0]
  become: true
  gather_facts: false

  tasks:
      - name: Initialize the cluster (runs only once)
        ansible.builtin.command:
            cmd: "{{ crdb_install_dir }}/cockroach init --insecure --host={{ ansible_host }}:26257 -v"
        register: init_result
        changed_when: init_result.rc == 0
        failed_when: init_result.rc != 0 and 'cluster has already been initialized' not in init_result.stderr
        vars:
            crdb_install_dir: "/usr/local/bin"
        delay: 10
        retries: 3
        until: init_result is success or 'cluster has already been initialized' in init_result.stderr

      - name: Display initialization result
        ansible.builtin.debug:
            var: init_result
            verbosity: 1

- name: Apply CockroachDB Enterprise License (Plain Text File - Insecure)
  hosts: cockroachdb[0]
  become: false
  gather_facts: false
  vars_files:
      - vars/crdb_secrets.yml

  vars:
      crdb_install_dir: "/usr/local/bin"

  tasks:
      - name: Set CockroachDB enterprise license key
        ansible.builtin.command:
            cmd: >-
                {{ crdb_install_dir }}/cockroach sql
                --execute="SET CLUSTER SETTING enterprise.license = '{{ crdb_enterprise_license_key }}';"
                --host={{ ansible_host }}:26257 --insecure
        register: set_license_result
        failed_when: false
        changed_when: "'cluster setting updated' in set_license_result.stdout"

- name: Install and Configure MinIO (Single Node Single Drive)
  hosts: minio
  become: true
  vars_files:
      - vars/minio_secrets.yml
  vars:
      # --- MinIO Configuration ---
      minio_user: "minio-user"
      minio_group: "minio-user"
      minio_home_dir: "/var/local/minio"
      minio_install_dir: "/usr/local/bin"
      minio_config_dir: "/etc/minio"
      minio_env_file_path: "/etc/default/minio"
      minio_binary_url: "https://dl.min.io/server/minio/release/linux-{{ go_arch }}/minio"
      minio_limit_nofile: 1048576
      minio_console_port: 9001
      # --- Define ONE data directory ---
      # IMPORTANT: Separate storage (mounted here) is still recommended for performance/reliability.
      # If this path is on the root drive, MinIO *might* still fail without MINIO_CI_CD=true workaround.
      minio_data_dir: "/mnt/minio-data"

  tasks:
      - name: Ensure MinIO group exists
        ansible.builtin.group:
            name: "{{ minio_group }}"
            state: present
            system: true

      - name: Ensure MinIO user exists
        ansible.builtin.user:
            name: "{{ minio_user }}"
            group: "{{ minio_group }}"
            home: "{{ minio_home_dir }}"
            shell: /sbin/nologin
            system: true
            create_home: true
            state: present

      - name: Ensure MinIO data directory exists (including parents) and has correct permissions
        ansible.builtin.file:
            path: "{{ minio_data_dir }}"
            state: directory
            owner: "{{ minio_user }}"
            group: "{{ minio_group }}"
            mode: "0750"

      - name: Ensure MinIO config directory exists
        ansible.builtin.file:
            path: "{{ minio_config_dir }}"
            state: directory
            owner: root
            group: "{{ minio_group }}"
            mode: "0750"

      - name: Check if MinIO binary already exists
        ansible.builtin.stat:
            path: "{{ minio_install_dir }}/minio"
        register: minio_binary_stat

      - name: Download MinIO server binary
        ansible.builtin.get_url:
            url: "{{ minio_binary_url }}"
            dest: "{{ minio_install_dir }}/minio"
            mode: "0755"
            owner: root
            group: root
        when: not minio_binary_stat.stat.exists

      - name: Template MinIO environment file (credentials)
        ansible.builtin.template:
            src: templates/minio.default.j2
            dest: "{{ minio_env_file_path }}"
            owner: root
            group: "{{ minio_group }}"
            mode: "0640"
        notify: Restart minio

      - name: Template MinIO systemd service file (SNSD version)
        ansible.builtin.template:
            src: templates/minio.service.j2
            dest: /etc/systemd/system/minio.service
            owner: root
            group: root
            mode: "0644"
        notify: Reload systemd

      - name: Ensure MinIO service is enabled and started
        ansible.builtin.systemd:
            name: minio
            enabled: true
            state: started
            daemon_reload: true

  handlers:
      - name: Reload systemd
        ansible.builtin.systemd:
            daemon_reload: true

      - name: Restart minio
        ansible.builtin.systemd:
            name: minio
            state: restarted
            enabled: true

- name: Install and Configure Redis
  hosts: redis
  become: true
  tasks:
      - name: Install redis-server
        ansible.builtin.apt:
            name: redis-server
            state: present
            update_cache: true

      - name: Allow Redis to listen on all interfaces
        ansible.builtin.lineinfile:
            path: /etc/redis/redis.conf
            regexp: '^bind '
            line: 'bind 0.0.0.0'
        notify: Restart redis-server

      - name: Disable protected mode
        ansible.builtin.lineinfile:
            path: /etc/redis/redis.conf
            regexp: '^protected-mode '
            line: 'protected-mode no'
        notify: Restart redis-server

      - name: Ensure Redis is enabled and started
        ansible.builtin.systemd:
            name: redis-server
            enabled: true
            state: started

  handlers:
      - name: Restart redis-server
        ansible.builtin.systemd:
            name: redis-server
            state: restarted

- name: Deploy EvOC Microservices
  hosts: master
  become: false
  tasks:
      - name: Create kubernetes manifests directory on master
        ansible.builtin.file:
            path: "~/kubernetes"
            state: directory
            mode: "0755"

      - name: Copy Kubernetes manifests to master
        ansible.builtin.copy:
            src: ../kubernetes/
            dest: "~/kubernetes/"
            mode: "0644"

      - name: Apply Kubernetes manifests
        ansible.builtin.command:
            cmd: "kubectl apply -f ~/kubernetes/"
        register: deploy_result
        changed_when: "'created' in deploy_result.stdout or 'configured' in deploy_result.stdout"
