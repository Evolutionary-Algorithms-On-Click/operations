services:
  minio:
    image: "minio/minio"
    container_name: minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - evoc-net

  cockroachdb:
    image: cockroachdb/cockroach:v25.4.0
    container_name: cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8082:8080"
    volumes:
      - cockroach-data-v3:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "node", "status", "--insecure"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - evoc-net

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - evoc-net

  auth:
    image: ghcr.io/evolutionary-algorithms-on-click/auth_microservice:latest
    container_name: auth
    depends_on:
      cockroachdb:
        condition: service_healthy
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      DATABASE_URL: ${COCKROACHDB_URL}
      MAILER_EMAIL: ${MAILER_EMAIL}
      MAILER_PASSWORD: ${MAILER_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      HTTP_PORT: ${AUTH_HTTP_PORT}
      GRPC_PORT: ${AUTH_GRPC_PORT}
      ENV: "PRODUCTION"
      INIT_DB: ${INIT_DB_FLAG}
    healthcheck:
      # TODO: Add healthcheck for gRPC endpoint too.
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/test"]
      interval: 15s
      timeout: 5s
      retries: 5
    pull_policy: always
    networks:
      - evoc-net

  runner_controller:
    image: ghcr.io/evolutionary-algorithms-on-click/runner_controller_microservice:latest
    container_name: runner_controller
    depends_on:
      cockroachdb:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5002:5002"
    environment:
      DATABASE_URL: ${COCKROACHDB_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      HTTP_PORT: ${RUNNER_CONTROLLER_HTTP_PORT}
      AUTH_GRPC_ADDRESS: ${AUTH_GRPC_ADDRESS}
      REDIS_URL: ${REDIS_URL}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/test"]
      interval: 15s
      timeout: 5s
      retries: 5
    pull_policy: always
    networks:
      - evoc-net

  controller_v2:
    image: ghcr.io/evolutionary-algorithms-on-click/controller_v2:latest
    container_name: controller_v2
    volumes:
      - user_data:/mnt/user_data
    ports:
      - "5003:8080"
    environment:
      DATABASE_URL: "postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable"
      APP_ENV: ${BACKEND_ENV}
      JUPYTER_GATEWAY_URL: "http://jupyter_gateway:8888"
      JUPYTER_AUTH_TOKEN: "YOUR_SECRET_TOKEN"
      CULL_INTERVAL_MINUTES: 10
      IDLE_THRESHOLD_MINUTES: 30
      AUTH_GRPC_ADDRESS: "auth:5001"
      LLM_MICROSERVICE_URL: "http://llm_service:5004"
      VOLPE_SERVICE_URL: "http://host.docker.internal:7070"
      USER_DATA_DIR: "/mnt/user_data"
    networks:
      - evoc-net
    depends_on:
      cockroachdb:
        condition: service_started
      jupyter_gateway:
        condition: service_started
      minio:
        condition: service_started
      llm_service:
        condition: service_healthy
    pull_policy: always

  jupyter_gateway:
    image: ghcr.io/evolutionary-algorithms-on-click/jupyter_gateway:latest
    container_name: jupyter_gateway
    volumes:
      - user_data:/mnt/user_data
    environment:
      KG_AUTH_TOKEN: 'YOUR_SECRET_TOKEN'
      KG_ALLOW_ORIGIN: '*'
      KG_IP: '0.0.0.0'
      KG_PORT: 8888
    ports:
      - "8888:8888"
    networks:
      - evoc-net
    depends_on:
      python_runner:
        condition: service_started
    pull_policy: always

  python_runner:
    image: ghcr.io/evolutionary-algorithms-on-click/python_runner:latest
    container_name: python_runner
    networks:
      - evoc-net
    pull_policy: always

  runner:
    image: ghcr.io/evolutionary-algorithms-on-click/runner:latest
    container_name: runner
    depends_on:
      cockroachdb:
        condition: service_healthy
      minio:
        condition: service_healthy
      runner_controller:
        condition: service_healthy
      controller_v2:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      COCKROACHDB_URL: ${COCKROACHDB_URL}
      MINIO_URL: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      REDIS_URL: ${REDIS_URL}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME}
    pull_policy: always
    networks:
      - evoc-net

  evolve_frontend:
    image: ghcr.io/evolutionary-algorithms-on-click/evolve_frontend:latest
    container_name: evolve_frontend
    depends_on:
      - controller_v2
      - auth
    environment:
      NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL}
      NEXT_PUBLIC_V2_BACKEND_BASE_URL: ${NEXT_PUBLIC_V2_BACKEND_BASE_URL}
      NEXT_PUBLIC_AUTH_BASE_URL: ${NEXT_PUBLIC_AUTH_BASE_URL}
      NEXT_PUBLIC_MINIO_BASE_URL: ${NEXT_PUBLIC_MINIO_BASE_URL}
      NEXT_PUBLIC_AI: ${NEXT_PUBLIC_AI}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
    pull_policy: always
    networks:
      - evoc-net
      
  llm_service:
    image: ghcr.io/evolutionary-algorithms-on-click/llm_service:sha-5684471
    container_name: llm_service
    ports:
      - "${PORT:-5004}:5004"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-llama-3.3-70b-versatile}
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=5004
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - chroma_data:/tmp/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5004/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - evoc-net

volumes:
  minio-data:
  cockroach-data-v3:
  chroma_data:
  user_data:

networks:
  evoc-net:
    driver: bridge
